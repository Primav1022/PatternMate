[supervisord]
logfile=/root/autodl-tmp/CHI27/.run/supervisord.log
pidfile=/root/autodl-tmp/CHI27/.run/supervisord.pid
childlogdir=/root/autodl-tmp/CHI27/.run

[unix_http_server]
file=/root/autodl-tmp/CHI27/.run/supervisor.sock

[supervisorctl]
serverurl=unix:///root/autodl-tmp/CHI27/.run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:geometry]
command=/root/miniconda3/bin/python -m uvicorn app:app --app-dir /root/autodl-tmp/CHI27/apps/geometry-service --host 127.0.0.1 --port 8788
directory=/root/autodl-tmp/CHI27
environment=CHI27_ROOT="/root/autodl-tmp/CHI27",MODEL_ENABLED="true",MODEL_BASE_URL="http://127.0.0.1:8791/v1",MODEL_NAME="qwen3-vl",MODEL_API_KEY="local-patternmate",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/root/autodl-tmp/CHI27/.run/geometry.log
stderr_logfile=/root/autodl-tmp/CHI27/.run/geometry-error.log

[program:tryon]
command=/root/autodl-tmp/CHI27/.venv-cloth/bin/python -m uvicorn app:app --app-dir /root/autodl-tmp/CHI27/apps/tryon-service --host 127.0.0.1 --port 8790
directory=/root/autodl-tmp/CHI27
environment=ENABLE_RESEARCH_3D="true",TRYON_DEVICE="cuda:0",TRYON_CLOTH_PYTHON="/root/autodl-tmp/CHI27/.venv-cloth/bin/python",TRYON_RESULT_DIR="/root/autodl-tmp/CHI27/.cache/tryon-results",SMPL_MODEL_DIR="/root/autodl-tmp/CHI27/tmp/SMPL_python_v.1.1.0/smpl/models",PATTERNMATE_GPU_LOCK="/root/autodl-tmp/CHI27/.run/gpu.lock",TORCH_HOME="/root/autodl-tmp/.cache/torch",XDG_CACHE_HOME="/root/autodl-tmp/.cache",WARP_CACHE_PATH="/root/autodl-tmp/.cache/warp",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/root/autodl-tmp/CHI27/.run/tryon.log
stderr_logfile=/root/autodl-tmp/CHI27/.run/tryon-error.log

[program:ai]
command=/root/miniconda3/bin/python -m uvicorn app:app --app-dir /root/autodl-tmp/CHI27/apps/ai-service --host 127.0.0.1 --port 8791
directory=/root/autodl-tmp/CHI27
environment=COMFY_BASE_URL="http://127.0.0.1:8188",COMFY_MODEL_DIR="/root/autodl-tmp/ComfyUI/models",VLLM_BASE_URL="http://127.0.0.1:8801/v1",AI_RESULT_DIR="/root/autodl-tmp/CHI27/.cache/ai-results",PATTERNMATE_GPU_LOCK="/root/autodl-tmp/CHI27/.run/gpu.lock",IMAGE_BACKEND="api",IMAGE_MODEL_BASE_URL="https://128api.cn/v1",IMAGE_MODEL_NAME="gpt-image-2",IMAGE_MODEL_API_KEY="%(ENV_IMAGE_MODEL_API_KEY)s",IMAGE_MODEL_TIMEOUT_SECONDS="180",IMAGE_MODEL_SSL_VERIFY="true",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/root/autodl-tmp/CHI27/.run/ai.log
stderr_logfile=/root/autodl-tmp/CHI27/.run/ai-error.log

[program:qwen-vl]
command=/root/autodl-tmp/CHI27/.venv-ai/bin/python -m uvicorn chat_server:app --app-dir /root/autodl-tmp/CHI27/apps/ai-service --host 127.0.0.1 --port 8801
directory=/root/autodl-tmp/CHI27
environment=QWEN_VL_MODEL="/root/autodl-tmp/models/Qwen3-VL-4B-Instruct-FP8",QWEN_VL_SERVED_NAME="qwen3-vl",HF_HOME="/root/autodl-tmp/.cache/huggingface",HF_ENDPOINT="https://hf-mirror.com",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/root/autodl-tmp/CHI27/.run/qwen-vl.log
stderr_logfile=/root/autodl-tmp/CHI27/.run/qwen-vl-error.log

[program:comfy]
command=/root/autodl-tmp/CHI27/.venv-ai/bin/python /root/autodl-tmp/CHI27/apps/ai-service/comfy_launcher.py --listen 127.0.0.1 --port 8188 --lowvram --disable-auto-launch
directory=/root/autodl-tmp/ComfyUI
environment=HF_HOME="/root/autodl-tmp/.cache/huggingface",COMFY_ROOT="/root/autodl-tmp/ComfyUI",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stdout_logfile=/root/autodl-tmp/CHI27/.run/comfy.log
stderr_logfile=/root/autodl-tmp/CHI27/.run/comfy-error.log

[program:nginx]
command=/usr/sbin/nginx -c /root/autodl-tmp/CHI27/deploy/autodl/nginx.conf -g "daemon off;"
directory=/root/autodl-tmp/CHI27
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/CHI27/.run/nginx.log
stderr_logfile=/root/autodl-tmp/CHI27/.run/nginx-supervisor-error.log
