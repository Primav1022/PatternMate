name: Geometry tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/geometry-service/**'
      - 'packages/catalogs/**'
      - '.github/workflows/geometry-tests.yml'
  pull_request:
    paths:
      - 'apps/geometry-service/**'
      - 'packages/catalogs/**'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Catalog tests
        working-directory: apps/geometry-service
        run: python -m unittest tests.test_catalog_scope -v
