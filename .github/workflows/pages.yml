name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NO_PUBLIC_COPY: "1"
          VITE_BASE: /PatternMate/
          VITE_ASSET_BASE: https://raw.githubusercontent.com/Primav1022/PatternMate/main/public
          VITE_WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
          VITE_TEXT_BASE_URL: ${{ vars.WORKER_BASE_URL || 'https://u1120192-9f8l-cc0c3595.weste.seetacloud.com:8443/geometry' }}
          VITE_AI_BASE_URL: ${{ vars.WORKER_BASE_URL || 'https://u1120192-9f8l-cc0c3595.weste.seetacloud.com:8443/ai' }}
          VITE_GEOMETRY_BASE_URL: https://u1120192-9f8l-cc0c3595.weste.seetacloud.com:8443/geometry
          VITE_TRYON_BASE_URL: https://u1120192-9f8l-cc0c3595.weste.seetacloud.com:8443/tryon
          VITE_API_BASE_URL: https://u1120192-9f8l-cc0c3595.weste.seetacloud.com:8443/geometry
      - run: mkdir -p dist/brand && cp public/brand/logo.svg dist/brand/logo.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
